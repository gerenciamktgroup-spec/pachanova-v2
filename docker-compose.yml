version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pachanova_demo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pachanova_demo
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pachanova_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pachanova_db_data:
